apiVersion: v2
name: doc-extraction-lite
description: Document Extraction Lite application
type: application
version: 0.1.0
appVersion: "1.0.0"

annotations:
  dkubex: |
    url: "/doc-extraction-lite"
    displayName: Doc Extraction Lite
    icon: "https://Santosh-oc.github.io/doc-extraction-lite/doc-extraction-lite.svg"
    docs: "https://dkubeio.github.io/docs-site/components/doc-extraction-lite/"
    description: "A simple document extraction application with PDF text extraction and LLM-based field extraction."
    categories:
      - "AI / ML"
      - "Other"
    roles:
      - "user"
      - "admin"
    resources:
      cpu:
        min: "100m"
        recommended: "500m"
      memory:
        min: "256Mi"
        recommended: "1024Mi"
    dependencies:
      - postgres
    routing:
      type: basepath
    images:
      - "https://raw.githubusercontent.com/dkubeio/dkubex-apps/main/screenshots/doc-extraction-lite-1.png"
